name: Build luci-app-hermes-euicc IPK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y bash coreutils grep sed tar gzip findutils file dos2-utils dos2unix

      - name: Fix permissions
        run: |
          find . -type f -name "*.sh" -exec dos2unix {} \; || true
          chmod +x build.sh

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build IPK
        run: |
          ./build.sh
          find . -name "*.ipk" -type f -print

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-hermes-euicc-ipk
          path: |
            build_ipk/*.ipk
            **/*.ipk
