name: Build OpenWrt lpac IPK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget tar xz-utils cmake ninja-build

      - name: Download OpenWrt SDK
        run: |
          SDK_PATH="releases/23.05.4/targets/mediatek/filogic/openwrt-sdk-23.05.4-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz"

          rm -f sdk.tar.xz

          for BASE in \
            "https://downloads.openwrt.org" \
            "https://mirrors.tuna.tsinghua.edu.cn/openwrt" \
            "https://mirrors.ustc.edu.cn/openwrt" \
            "https://mirrors.aliyun.com/openwrt"
          do
            echo "Trying: $BASE/$SDK_PATH"
            if wget --tries=5 --waitretry=10 --timeout=60 -O sdk.tar.xz "$BASE/$SDK_PATH"; then
              echo "SDK downloaded successfully from $BASE"
              break
            fi
            rm -f sdk.tar.xz
          done

          test -s sdk.tar.xz

          mkdir -p sdk
          tar -xf sdk.tar.xz -C sdk --strip-components=1

      - name: Prepare feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add lpac package
        run: |
          cd sdk

          rm -rf package/lpac
          mkdir -p package/lpac/files

          wget --tries=5 --waitretry=5 -O package/lpac/Makefile \
            https://raw.githubusercontent.com/openwrt/packages/master/utils/lpac/Makefile

          wget --tries=5 --waitretry=5 -O package/lpac/Config.in \
            https://raw.githubusercontent.com/openwrt/packages/master/utils/lpac/Config.in

          wget --tries=5 --waitretry=5 -O package/lpac/files/lpac.sh \
            https://raw.githubusercontent.com/openwrt/packages/master/utils/lpac/files/lpac.sh

          wget --tries=5 --waitretry=5 -O package/lpac/files/lpac.uci \
            https://raw.githubusercontent.com/openwrt/packages/master/utils/lpac/files/lpac.uci

      - name: Configure lpac
        run: |
          cd sdk

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_lpac=y
          CONFIG_LPAC_WITH_AT=y
          CONFIG_LPAC_WITH_UQMI=y
          CONFIG_LPAC_WITH_MBIM=y
          # CONFIG_LPAC_WITH_PCSC is not set
          EOF

          make defconfig

      - name: Build lpac
        run: |
          cd sdk
          make package/lpac/compile V=s

          echo "=== Built IPK files ==="
          find bin/packages -type f -name "*.ipk" | sort

      - name: Collect IPKs
        run: |
          mkdir -p artifact

          find sdk/bin/packages -type f \( \
            -name "lpac_*.ipk" -o \
            -name "libcurl*.ipk" -o \
            -name "libmbim*.ipk" -o \
            -name "libnghttp2*.ipk" -o \
            -name "libopenssl*.ipk" -o \
            -name "ca-bundle*.ipk" -o \
            -name "uqmi*.ipk" \
          \) -exec cp -v {} artifact/ \;

          echo "=== Artifact contents ==="
          ls -lh artifact/

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-lpac-ipk
          path: artifact/*.ipk
