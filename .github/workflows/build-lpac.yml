name: Build OpenWrt lpac IPK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget tar xz-utils

      - name: Download OpenWrt SDK
        run: |
          wget -O sdk.tar.xz https://downloads.openwrt.org/releases/23.05.4/targets/mediatek/filogic/openwrt-sdk-23.05.4-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          mkdir sdk
          tar -xf sdk.tar.xz -C sdk --strip-components=1

      - name: Prepare feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add lpac package
        run: |
          cd sdk
          mkdir -p package/lpac/files
          wget -O package/lpac/Makefile https://raw.githubusercontent.com/openwrt/packages/master/utils/lpac/Makefile
          wget -O package/lpac/Config.in https://raw.githubusercontent.com/openwrt/packages/master/utils/lpac/Config.in
          wget -O package/lpac/files/lpac.sh https://raw.githubusercontent.com/openwrt/packages/master/utils/lpac/files/lpac.sh
          wget -O package/lpac/files/lpac.uci https://raw.githubusercontent.com/openwrt/packages/master/utils/lpac/files/lpac.uci

      - name: Configure lpac
        run: |
          cd sdk
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_lpac=y
          CONFIG_LPAC_WITH_AT=y
          CONFIG_LPAC_WITH_UQMI=y
          CONFIG_LPAC_WITH_MBIM=y
          # CONFIG_LPAC_WITH_PCSC is not set
          EOF
          make defconfig

      - name: Build lpac
        run: |
          cd sdk
          make package/lpac/compile V=s
          find bin/packages -name "*lpac*.ipk" -o -name "libcurl*.ipk" -o -name "libmbim*.ipk" -o -name "uqmi*.ipk"

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-lpac-ipk
          path: |
            sdk/bin/packages/**/*.ipk
